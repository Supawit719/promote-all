<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PROMOTE ALL ROUND – รีวิวครบจบในเว็บเดียว</title>
<style>
body{font-family:Arial, sans-serif;margin:0;background:#111;color:#eee}
header{background:#222;padding:20px;text-align:center;position:relative}
header h1{margin:0}
.container{padding:20px;max-width:900px;margin:auto}
.search-box{margin-bottom:20px;display:flex;gap:10px}
input, select, button{width:100%;padding:10px;margin:5px 0;border-radius:8px;border:none}
button{cursor:pointer;background:#444;color:#fff}
.card{background:#1c1c1c;padding:15px;border-radius:12px;margin-bottom:15px}
.rating span{cursor:pointer;font-size:22px;color:gold}
.comment{background:#2a2a2a;padding:8px;border-radius:8px;margin-top:6px}
hr{border:0;border-top:1px solid #333;margin:30px 0}

/* admin icon */
#adminBtn{
 position:absolute;top:15px;right:15px;
 width:36px;height:36px;border-radius:50%;
 background:#555;display:flex;align-items:center;justify-content:center;
 cursor:pointer
}
.delete{background:#a00;margin-top:10px}

/* floating icons */
#floatIcons{
 position:fixed;right:20px;bottom:20px;
 display:flex;flex-direction:column;gap:12px;z-index:999
}
.floatIcon{
 width:56px;height:56px;border-radius:50%;
 background:#333;color:#fff;
 display:flex;align-items:center;justify-content:center;
 font-size:26px;cursor:pointer;
 box-shadow:0 0 10px #000
}

/* add box */
#addBox{
 display:none;
 background:#1c1c1c;
 padding:15px;
 border-radius:12px;
 margin-top:20px
}
</style>
</head>
<body>

<header>
<h1>PROMOTE ALL ROUND</h1>
<p>โรงเรียน • ร้านค้า • หนัง • นิยาย • อนิเมะ • มังงะ</p>
<div id="adminBtn" onclick="adminLogin()">🔒</div>
</header>

<div class="container">

<div class="search-box">
<input type="text" id="search" placeholder="ค้นหาชื่อสถานที่ / เรื่อง..." onkeyup="render()">
<select id="category" onchange="render()">
<option value="">ทุกหมวด</option>
<option>โรงเรียน</option>
<option>ร้านค้า</option>
<option>หนังโรง</option>
<option>นิยาย</option>
<option>อนิเมะ</option>
<option>มังงะ</option>
<option>BL</option>
<option>Yuri</option>
<option>Fantasy</option>
</select>
</div>

<div id="list"></div>

<!-- ADD ITEM BOX -->
<div id="addBox">
<hr>
<h2>เพิ่มรายการใหม่</h2>
<input id="newTitle" placeholder="ชื่อรายการ">
<select id="newCat">
<option>โรงเรียน</option><option>ร้านค้า</option><option>หนังโรง</option>
<option>นิยาย</option><option>อนิเมะ</option><option>มังงะ</option>
<option>BL</option><option>Yuri</option><option>Fantasy</option>
</select>
<button onclick="addItem()">เพิ่มรายการ</button>
</div>

</div>

<!-- FLOATING ICONS -->
<div id="floatIcons">
<div class="floatIcon" onclick="contactAdmin()">💬</div>
<div class="floatIcon" onclick="toggleAdd()">➕</div>
</div>

<script>
const ADMIN_PASSWORD = "gunluvmon010250130848";
let isAdmin = false;

let data = JSON.parse(localStorage.getItem('data') || '[]');

function save(){
 localStorage.setItem('data', JSON.stringify(data));
}

function adminLogin(){
 const p = prompt('ใส่รหัสแอดมิน');
 if(p === ADMIN_PASSWORD){
  isAdmin = true;
  alert('เข้าสู่โหมดแอดมินแล้ว');
  render();
 }
}

function toggleAdd(){
 const box = document.getElementById('addBox');
 box.style.display = box.style.display === 'block' ? 'none' : 'block';
}

function contactAdmin(){
 alert(
  "ติดต่อแอดมิน\n\n" +
  "Line:ID105951323\n" +
  "Facebook:MA ST\n" +
  "Email:kizura.ls.2006@gmail.com"
 );
}

function addItem(){
 const t = newTitle.value.trim();
 if(!t) return;
 data.push({
  title:t,
  cat:newCat.value,
  ratings:[],
  comments:[]
 });
 save();
 newTitle.value='';
 render();
}

function rate(i,val){
 data[i].ratings.push(val);
 save();
 render();
}

function comment(i){
 const name = prompt('ชื่อผู้รีวิว') || 'ผู้ใช้ไม่ระบุชื่อ';
 const text = prompt('คอมเมนต์');
 if(!text) return;
 data[i].comments.push({name,text});
 save();
 render();
}

function delItem(i){
 if(confirm('ลบรายการนี้?')){
  data.splice(i,1);
  save();
  render();
 }
}

function avg(r){
 if(!r.length) return 'ยังไม่มี';
 return (r.reduce((a,b)=>a+b,0)/r.length).toFixed(1)+' / 5';
}

function render(){
 const s = search.value.toLowerCase();
 const c = category.value;
 list.innerHTML='';
 data.forEach((d,i)=>{
  if(s && !d.title.toLowerCase().includes(s)) return;
  if(c && d.cat!==c) return;
  list.innerHTML += `
  <div class="card">
   <h3>${d.title}</h3>
   <p>หมวด: ${d.cat}</p>
   <p>คะแนนเฉลี่ย: ${avg(d.ratings)}</p>
   <div class="rating">
    ${[1,2,3,4,5].map(v=>`<span onclick="rate(${i},${v})">★</span>`).join('')}
   </div>
   <button onclick="comment(${i})">เขียนรีวิว</button>
   ${d.comments.map(cm=>`
     <div class="comment"><b>${cm.name}</b>: ${cm.text}</div>
   `).join('')}
   ${isAdmin ? `<button class="delete" onclick="delItem(${i})">ลบโพสต์</button>` : ``}
  </div>`;
 });
}

render();
</script>
</body>
</html>
