<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PROMOTE ALL ROUND</title>
<style>
body{font-family:Arial;margin:0;background:#111;color:#eee}
header{background:#222;padding:20px;text-align:center;position:relative}
.container{max-width:900px;margin:auto;padding:20px}
input,select,textarea,button{width:100%;padding:10px;margin:5px 0;border-radius:8px;border:none}
button{background:#444;color:#fff;cursor:pointer}
.card{background:#1c1c1c;padding:15px;border-radius:12px;margin-bottom:15px}
.rating span{font-size:22px;cursor:pointer;color:gold}
.comment{background:#2a2a2a;padding:8px;border-radius:8px;margin-top:6px}

/* admin icon */
.admin-icon{
 position:absolute;top:15px;right:15px;
 width:34px;height:34px;border-radius:50%;
 background:#333;display:flex;align-items:center;justify-content:center;
 cursor:pointer;font-size:18px
}
.admin-panel{display:none;background:#1c1c1c;padding:15px;border-radius:12px;margin-bottom:20px}
.admin-btn{background:#800}
</style>
</head>
<body>
<header>
<h1>PROMOTE ALL ROUND</h1>
<p>รีวิว • ให้คะแนน • ทุกคนเห็นเหมือนกัน</p>
<div class="admin-icon" onclick="toggleAdmin()">⚙</div>
</header>

<div class="container">
<!-- ADMIN PANEL -->
<div id="adminPanel" class="admin-panel">
<h3>โหมดผู้ดูแล</h3>
<input id="adminKey" placeholder="รหัสแอดมิน">
<button onclick="loginAdmin()">เข้าสู่ระบบ</button>
</div>

<h3>เพิ่มรายการ</h3>
<input id="newTitle" placeholder="ชื่อรายการ">
<select id="newCat">
<option>โรงเรียน</option><option>ร้านค้า</option><option>หนังโรง</option>
<option>นิยาย</option><option>อนิเมะ</option><option>มังงะ</option>
<option>BL</option><option>Yuri</option><option>Fantasy</option>
</select>
<button onclick="addItem()">เพิ่มรายการ</button>
<hr>
<div id="list"></div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script>
/* Firebase config */
const firebaseConfig = {
 apiKey: "YOUR_API_KEY",
 authDomain: "YOUR_PROJECT.firebaseapp.com",
 databaseURL: "https://YOUR_PROJECT.firebaseio.com",
 projectId: "YOUR_PROJECT",
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

/* ADMIN */
const ADMIN_PASSWORD="1234";
let isAdmin=false;
function toggleAdmin(){
 adminPanel.style.display = adminPanel.style.display==='block'?'none':'block';
}
function loginAdmin(){
 if(adminKey.value===ADMIN_PASSWORD){isAdmin=true;adminPanel.style.display='none';render();alert('เข้าสู่โหมดแอดมิน');}
 else alert('รหัสไม่ถูกต้อง');
}

/* ADD ITEM */
function addItem(){
 const t=newTitle.value.trim(); if(!t)return;
 db.ref('items').push({title:t,cat:newCat.value});
 newTitle.value='';
}

/* LOAD ITEMS */
db.ref('items').on('value',snap=>{
 list.innerHTML='';
 snap.forEach(c=>list.innerHTML+=renderItem(c.key,c.val()));
});

function renderItem(id,d){
 return `<div class='card'>
 <h3>${d.title}</h3>
 <p>หมวด: ${d.cat}</p>
 <div class='rating'>${[1,2,3,4,5].map(v=>`<span onclick=rate('${id}',${v})>★</span>`).join('')}</div>
 <button onclick=comment('${id}')>เขียนรีวิว</button>
 ${isAdmin?`<button class='admin-btn' onclick=del('${id}')>ลบโพส</button>`:''}
 <div id='c-${id}'></div>
 </div>`;
}

function rate(id,val){ db.ref('ratings/'+id).push(val); }
function comment(id){
 const name=prompt('ชื่อ')||'ไม่ระบุ';
 const text=prompt('คอมเมนต์'); if(!text)return;
 db.ref('comments/'+id).push({name,text});
}
function del(id){ if(confirm('ลบจริงไหม')) db.ref('items/'+id).remove(); }

/* LOAD COMMENTS */
db.ref('comments').on('value',snap=>{
 snap.forEach(p=>{
  const box=document.getElementById('c-'+p.key);
  if(!box)return;
  box.innerHTML='';
  p.forEach(c=>{
   const d=c.val();
   box.innerHTML+=`<div class='comment'><b>${d.name}</b>: ${d.text}</div>`;
  });
 });
});
</script>
</body>
</html>
